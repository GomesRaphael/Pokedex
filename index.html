<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
</head>

<body>
    <main>
        <img src="" alt="pokemon" class="pokemon__image">
        <img src="images/pokedex.png" alt="pokedex" class="pokedex">
        <h1 class="pokemon__data">
            <span class="pokemon__Number"></span> -
            <span class="pokemon__Name"></span>
        </h1>
        <form class="form">
            <input type="search" class="input__search" placeholder="Nome ou Numero" required />
        </form>
        <div class="buttons">
            <button class="button btn-prev">Prev &#60;</button>
            <button class="button btn-next">Next &#62;</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
